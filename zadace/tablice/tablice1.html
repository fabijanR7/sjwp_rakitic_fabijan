<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tablice</title>
  </head>
  <body>
    <h1>TABLICE</h1>

    <table border="1" width="549">
      <tr>
        <th>tvrtka</th>
        <th>kontkat</th>
        <th>zemlja</th>
      </tr>
      <tr>
        <td>primax.doo</td>
        <td>vedran dankic</td>
        <td>hrvatska</td>
      </tr>
      <tr>
        <td>veterinar</td>
        <td>davorin</td>
        <td>Austrija</td>
      </tr>
    </table>
    <hr />

    <h2>Spajanje stupaca</h2>
    <table border="1">
      <tr>
        <th colspan="2">ime i prezime</th>
        <th>godine</th>
      </tr>
      <tr>
        <td>filp</td>
        <td>dankic</td>
        <td>15</td>
      </tr>
      <tr>
        <td>petar</td>
        <td>cetinjanin</td>
        <td>21</td>
      </tr>
    </table>

    <p>za spajanje redova sve je isto samo koristimo <mark>rowspan</mark></p>
  </body>
</html>
