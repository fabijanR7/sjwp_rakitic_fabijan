<!doctype html>
<html>
  <head>
    <title>CSS Positioning Exercise</title>
    <style>
      .b {
        position: relative;
        background-color: blue;
        width: 500px;
        height: 300px;
        position: relative;
        top: 200px;
        left: 200px;
      }
      .red {
        border-radius: 50%;
        position: absolute;
        background-color: red;
        height: 200px;
        width: 200px;
        left: 250px;
        top: 150px;
      }
    </style>
  </head>

  <body>
    <div class="b">
      <div class="red"></div>
    </div>
  </body>
</html>
