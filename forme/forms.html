<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORME</title>
  </head>
  <body>
    <h1>HTML forme</h1>
    <form action="#" method="get">
      <label for="name">Unesi ime: </label>
      <input
        type="text"
        id="name"
        placeholder="unesi ime..."
        size="15"
        maxlength="5"
      />
      <br />
      <label for="pass">Unesi lozinku</label>
      <input type="password" name="pass" id="pass" />
      <br />
      <label for="mail">Unesi mail</label>
      <input type="email" name="mail" id="mail" />
      <br />
      <label for="date">datum: </label>
      <input type="date" name="date" id="date" />
      <br />
      <label for="color">boja: </label>
      <input type="color" name="color" id="color" />
      <br />
      <label for="file">izaberi file</label>
      <input type="file" name="file" />
      <br />
      <label for="tel">telefon</label>
      <input type="tel" />
      <br />
      <p>odaberi najb. klub</p>
      <input type="radio" name="klub" id="real" />
      <label for="real">Real Madrid</label> <br />
      <input type="radio" name="klub" id="shit" />
      <label for="real">barca</label> <br />
      <input type="radio" name="klub" id="marsa" />
      <label for="real">Marsonia</label> <br />
      //ovo je za vise odabira
      <p>odaberi najb. klub</p>
      <input type="checkbox" name="klub1" id="real" />
      <label for="real">real madrid</label>
      <input type="submit" value="posalji" />
      <input type="reset" value="obrisi sve" />
    </form>
  </body>
</html>
