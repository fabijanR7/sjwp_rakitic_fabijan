<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laos</title>
    <style>
      .A {
        background-color: red;
        width: 500px;
        height: 350px;
        position: relative;
      }
      .B {
        background-color: blue;
        width: 500px;
        height: 200px;
        position: absolute;
        top: 80px;
      }
      .C {
        position: absolute;
        background-color: white;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        top: 105px;
        left: 165px;
      }
    </style>
  </head>
  <body>
    <div class="A">
      <div class="B"></div>
      <div class="C"></div>
    </div>
  </body>
</html>
